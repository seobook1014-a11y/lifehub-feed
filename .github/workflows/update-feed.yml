name: update-feed
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-feed
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate feed snapshots
        run: node scripts/generate-feed.mjs
      - name: Commit changed content or daily heartbeat
        id: commit
        run: |
          BEFORE=$(git rev-parse HEAD)
          CHANGED=$(git status --porcelain feed/ | head -5)
          TODAY=$(date -u +%F)
          LASTDATE=$(git log -1 --format=%ad --date=format:%F 2>/dev/null || echo none)
          if [ -n "$CHANGED" ] || [ "$TODAY" != "$LASTDATE" ]; then
            git add feed/ meta.json
            git -c user.name=feed-bot -c user.email=actions@github.com commit -m "feed update ${TODAY} $(date -u +%H:%M) UTC"
            git push
          fi
          if [ "$(git rev-parse HEAD)" != "$BEFORE" ]; then
            echo "committed=yes" >> "$GITHUB_OUTPUT"
          else
            echo "committed=no" >> "$GITHUB_OUTPUT"
            echo "no feed change, no heartbeat due"
          fi
      - name: Move feed-latest tag and purge jsDelivr when content changed
        if: steps.commit.outputs.committed == 'yes'
        run: |
          FEED_PATHS=$(git diff --name-only HEAD~1 HEAD -- feed/ | sed 's|^feed/|/gh/seobook1014-a11y/lifehub-feed@feed-latest/feed/|' | jq -Rsc 'split("\n") | map(select(length > 0)) | {path: .}')
          if [ "$FEED_PATHS" != '{"path":[]}' ]; then
            git tag -f feed-latest HEAD
            git push -f origin refs/tags/feed-latest
            curl -fsS -X POST "https://purge.jsdelivr.net/" -H 'Content-Type: application/json' -d "$FEED_PATHS" || echo "purge failed (rate limit?): $FEED_PATHS"
          fi
